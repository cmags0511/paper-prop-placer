name: Paper trade
on:
  schedule:
    - cron: "11 12 * * *"             # morning settle of last night's games
    - cron: "17 5-11 * * *"          # hourly overnight so finished games settle soon after the final buzzer
  workflow_dispatch:
concurrency:
  group: paper-trade
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cmags0511/prop-tracker
          path: prop-tracker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Run US trader
        env:
          POLYMARKET_API_KEY_ID: ${{ secrets.POLYMARKET_API_KEY_ID }}
          POLYMARKET_API_KEY_SECRET: ${{ secrets.POLYMARKET_API_KEY_SECRET }}
          LIVE: ${{ vars.LIVE_TRADING }}      # real orders ONLY if this repo variable is exactly 1
        run: python trader_us.py
      - name: Commit ledger
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "Update ledger"
          git pull --rebase origin main
          git push
