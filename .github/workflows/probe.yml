name: Polymarket probe (read-only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Probe (GET requests only)
        env:
          POLYMARKET_API_KEY_ID: ${{ secrets.POLYMARKET_API_KEY_ID }}
          POLYMARKET_API_KEY_SECRET: ${{ secrets.POLYMARKET_API_KEY_SECRET }}
        run: python probe.py
      - name: Commit result
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Probe result"
          git pull --rebase origin main
          git push
